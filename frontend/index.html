<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProcessData</title>
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico?v=3" />
    <link rel="icon" type="image/x-icon" href="img/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=3" />
    <link rel="manifest" href="site.webmanifest?v=3" />
    <!-- Aplica o tema antes do 1º paint (evita flash). O ThemeToggle assume depois. -->
    <script>
      try {
        var stored = localStorage.getItem("pd_theme");
        var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        var mode = stored ? stored : prefersLight ? "light" : "dark";
        if (mode === "dark") document.documentElement.classList.add("dark");
      } catch (e) {
        /* noop */
      }
    </script>
    <!-- ?v=N: bumpar a cada release pra invalidar o cache do browser -->
    <link rel="stylesheet" href="static/react/app-react.css?v=2" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Em dev, rode `npm run dev:react` (vite dev com HMR) e ative
      `localStorage.setItem('pd_dev_hmr','1')` no console + recarregue para
      carregar do dev server em vez do build estático. Sem a flag (padrão, e
      sempre em produção/CI), carrega o build de frontend/static/react/.
    -->
    <script type="module" src="static/react/app-react.js?v=2" defer id="pd-react-entry"></script>
    <script>
      (function () {
        var dev = false;
        try {
          dev = localStorage.getItem("pd_dev_hmr") === "1";
        } catch (e) {
          /* noop */
        }
        if (!dev) return;
        var current = document.getElementById("pd-react-entry");
        if (current) current.remove();
        var devHost = "http://localhost:5173/static/react";
        var preamble = document.createElement("script");
        preamble.type = "module";
        preamble.textContent =
          'import RefreshRuntime from "' +
          devHost +
          '/@react-refresh";' +
          "RefreshRuntime.injectIntoGlobalHook(window);" +
          "window.$RefreshReg$ = () => {};" +
          "window.$RefreshSig$ = () => (type) => type;" +
          "window.__vite_plugin_react_preamble_installed__ = true;";
        document.body.appendChild(preamble);
        var client = document.createElement("script");
        client.type = "module";
        client.src = devHost + "/@vite/client";
        document.body.appendChild(client);
        var main = document.createElement("script");
        main.type = "module";
        main.src = devHost + "/src/main.tsx";
        document.body.appendChild(main);
      })();
    </script>
  </body>
</html>
