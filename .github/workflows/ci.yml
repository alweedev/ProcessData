name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy -p backend
      - name: pytest (com cobertura)
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: coverage summary
        run: python -m coverage report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm --prefix frontend-react ci
      - name: oxlint
        run: npm --prefix frontend-react run lint
      - name: vitest
        run: npm --prefix frontend-react run test
      - name: build (tsc -b + vite build)
        run: npm --prefix frontend-react run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm --prefix frontend-react ci
      - run: npm run build:react
      - run: npx playwright install --with-deps chromium
      - name: playwright
        run: npx playwright test
        env:
          PYTHON: python
