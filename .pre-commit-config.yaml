# Hooks locais (language: system): chamam as mesmas ferramentas já instaladas
# pelo requirements.txt / npm --prefix frontend-react, em vez de mirrors
# externos com versão própria pra sincronizar com o CI. `pre-commit install`
# uma vez por clone; roda automaticamente em todo `git commit`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: ruff check
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format --check (backend)
        entry: ruff format --check
        language: system
        types: [python]
        files: ^backend/

      - id: mypy
        name: mypy (backend)
        entry: mypy -p backend
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: oxlint
        name: oxlint (frontend)
        entry: npm --prefix frontend-react run lint
        language: system
        pass_filenames: false
        files: ^frontend-react/src/.*\.(ts|tsx)$
