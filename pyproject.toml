[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "node_modules", "tests/e2e"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # comprimento de linha (formatador cuida do essencial)
    "B008",   # chamada em default de argumento (padrão Flask/FastAPI)
    "B905",   # zip() sem strict= (iteráveis de igual tamanho, controlados)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402", "F401"]
"backend/app.py" = ["E402"]  # imports após sys.path.insert (execução direta)

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
exclude = ["\\.venv", "node_modules", "backend/tests", "backend/app\\.py"]
